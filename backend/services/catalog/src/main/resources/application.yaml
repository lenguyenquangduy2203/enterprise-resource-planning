spring:
    config:
        import: optional:configserver:http://configurer:8888/
    application:
        name: catalog
    datasource:
        url: jdbc:mysql://mysql:3306/catalog
        username: ${MYSQL_USER}
        password: ${MYSQL_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
            dialect: org.hibernate.dialect.MySQL8Dialect
        show-sql: true