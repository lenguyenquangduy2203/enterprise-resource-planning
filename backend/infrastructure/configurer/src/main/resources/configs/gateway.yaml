server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://registry:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,refresh

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
    instances:
      hrCircuitBreaker:
        baseConfig: default

spring:
  cloud:
    gateway:
      routes:
        - id: hr
          uri: http://hr:8081
          predicates:
            - Path=/hr/**
          filters:
            - StripPrefix=1
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:5173
                  - http://0.0.0.0:5173
                allowed-methods:
                  - GET
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth-server:9000
    policy-overlay:
      role-permissions:
        ROLE_ADMIN:
          - system.admin
          - account.read
          - account.write
          - employee.read
          - employee.write
          - inventory.read
          - inventory.write
          - warehouse.manage
        ROLE_HR_MANAGER:
          - employee.read
          - employee.write
          - account.read
        ROLE_WAREHOUSE:
          - inventory.read
          - inventory.write
          - warehouse.manage
        ROLE_EMPLOYEE:
          - employee.read
          - inventory.read