server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://registry:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,refresh

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
    instances:
      hrCircuitBreaker:
        baseConfig: default
      authCircuitBreaker:
        baseConfig: default

spring:
  cloud:
    gateway:
      default-filters:
        - PreserveHostHeader
      routes:
        - id: hr
          uri: http://hr:8081
          predicates:
            - Path=/hr/**
          filters:
            - StripPrefix=1
        - id: catalog
          uri: http://catalog:8082
          predicates:
            - Path=/catalog/**
          filters:
            - StripPrefix=1
        - id: inv
          uri: http://inv:8083
          predicates:
            - Path=/inv/**
          filters:
            - StripPrefix=1
        - id: auth
          uri: http://auth-server:9000
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:5173
                  - http://0.0.0.0:5173
                allowed-methods:
                  - GET
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth-server:9000
    policy-overlay:
      role-permissions:
        ROLE_ADMIN:
          - account.read
          - account.write
          - department.read
          - department.write
          - employee.read
          - employee.write
          - product.read
          - product.write
          - category.read
          - category.write
          - manufacturer.read
          - manufacturer.write
          - stock.read
          - stock.write
          - stock_movement.read
          - stock_movement.write
          - warehouse.read
          - warehouse.write
        ROLE_HR_MANAGER:
          - employee.read
          - employee.write
          - account.read
          - account.write
          - department.read
        ROLE_WAREHOUSE:
          - stock.read
          - stock.write
          - stock_movement.read
          - stock_movement.write
          - warehouse.read
        ROLE_EMPLOYEE:
          - employee.read_own
          - stock.read
          - product.read
          - category.read