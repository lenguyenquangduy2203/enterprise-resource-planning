services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - erp
  configurer:
    build: ./backend/infrastructure/configurer
    image: configurer
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "sh", "-c", "ps -p 1 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - erp
  registry:
    build: ./backend/infrastructure/registry
    image: registry
    ports:
      - "8761:8761"
    depends_on:
      configurer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "ps -p 1 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - erp
  gateway:
    build: ./backend/infrastructure/gateway
    image: gateway
    ports:
      - "8080:8080"
    depends_on:
      configurer:
        condition: service_healthy
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "ps -p 1 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - erp
  auth-server:
    build: ./backend/infrastructure/auth
    image: auth-server
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "9000:9000"
    depends_on:
      configurer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "ps -p 1 > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - erp
  fresh-client:
    platform: linux/amd64
    build:
      context: ./frontend/fresh-client
      dockerfile: Dockerfile
    image: fresh-client
    ports:
      - "5173:5173"
    depends_on:
      auth-server:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      - erp
  hr:
    build: ./backend/services/hr
    image: hr
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      configurer:
        condition: service_healthy
    networks:
      - erp
  catalog:
    build: ./backend/services/catalog
    image: catalog
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      configurer:
        condition: service_healthy
    networks:
      - erp
  inv:
    build: ./backend/services/inventory
    image: inv
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8083:8083"
    depends_on:
      configurer:
        condition: service_healthy
    networks:
      - erp
  analysis:
    build: ./backend/services/analysis
    image: analysis
    ports:
      - "8084:8084"
    depends_on:
      configurer:
        condition: service_healthy
    networks:
      - erp

volumes:
  mysql_data:

networks:
  erp: